site_name: "Notes de cours - Applications mobiles Android avec Jetpack Compose"
site_description: "Notes de cours pour le développement d'applications mobiles Android avec Jetpack Compose et Kotlin - 420-5B4-VI"
site_author: "Christiane Lagacé"

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji

plugins:
  - search

nav:
  - "Accueil": "index.md"
  - "1. Environnement":
      - "Présentation du cours": "01-environnement/index.md"
      - "Installation & Outils": "01-environnement/installation.md"
      - "Création du projet": "01-environnement/premier-projet.md"
      - "Android Studio & Ressources": "01-environnement/android-studio.md"
